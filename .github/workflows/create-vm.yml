name: Try to Create OCI VM (IntNet-Proxy)

# 每 5 分钟自动尝试一次：抢不到资源时保持安静，抢到资源时故意失败以触发 GitHub 邮件通知。
on:
  schedule:
    - cron: "*/5 * * * *"
  # 允许你在 Actions 页面手动触发一次，便于首次测试配置是否正确。
  workflow_dispatch:

env:
  # 区域：Japan Central (Osaka)。全局变量来自 GitHub Secrets。
  OCI_REGION: ${{ secrets.OCI_CLI_REGION }}
  # 免费账户的 compartment 与 tenancy 相同，直接用 tenancy OCID。
  COMPARTMENT_ID: ${{ secrets.OCI_CLI_TENANCY }}
  STACK_OCID: ${{ secrets.STACK_OCID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 缓存 OCI CLI 的 pip 安装（加速后续每次运行）
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: 将 OCI CLI 加入 PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 安装 OCI CLI 并写入 OCI 配置
        run: |
          set -e
          pip install oci-cli

          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          region=${{ env.OCI_REGION }}
          EOF

          # 收紧 config 权限，避免 OCI CLI 打印 "config are too open" 警告污染输出
          chmod 600 ~/.oci/config

          # 抑制文件权限警告（OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING）与私钥标签警告
          {
            echo "OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True"
            echo "SUPPRESS_LABEL_WARNING=True"
          } >> $GITHUB_ENV

          echo "OCI CLI 配置完成，区域：${{ env.OCI_REGION }}"

      # 触发云上已有 Stack 的 apply 作业，并轮询直到出结果。
      # 该步骤始终以成功退出（静默），是否邮件通知由下一步决定。
      - name: 触发 Stack Apply 作业并轮询结果
        id: apply
        shell: bash
        run: |
          set -euxo pipefail

          JOB_ID=""
          APPLY_RESULT="timeout"

          # 0) 防重复创建：先检查实例是否已存在（防止抢到后未及时禁用工作流导致重复创建）
          #    从 OCI config 提取 tenancy（实例与 Stack 同属该 compartment），列出实例并匹配主机名
          TENANCY_OCID=$(sed -n 's/^tenancy[[:space:]]*=[[:space:]]*//p' ~/.oci/config | head -n1)
          if [ -n "$TENANCY_OCID" ]; then
            EXISTING=$(oci compute instance list \
              --compartment-id "$TENANCY_OCID" \
              --all \
              --query 'data[?"display-name"==`IntNet-Proxy` && "lifecycle-state"!=`TERMINATED`].id' \
              --raw-output 2>/dev/null || true)
            if [ -n "$EXISTING" ]; then
              echo "检测到已存在目标实例（IntNet-Proxy），不再创建，本次静默跳过。实例 OCID: $EXISTING"
              echo "apply_result=already_exists" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "未发现已存在的 IntNet-Proxy 实例，继续发起创建。"
          else
            echo "未能从 config 提取 tenancy，跳过实例存在性检查（仅作为防护兜底，不阻塞创建）。"
          fi

          # 1) 发起 apply 作业（创建失败则重试几次）
          # 注意: create-apply-job 不接受 --compartment-id，compartment 会从 --stack-id 自动推断
          # 用 --query + --raw-output 让 CLI 只输出纯 job id，避免手写解析 JSON
          for attempt in 1 2 3; do
            JOB_ID=$(oci resource-manager job create-apply-job \
              --stack-id "$STACK_OCID" \
              --execution-plan-strategy AUTO_APPROVED \
              --query 'data.id' --raw-output 2>/dev/null || true)
            if [ -n "$JOB_ID" ] && [ "$JOB_ID" != "null" ]; then
              break
            fi
            echo "创建 apply 作业失败（第 ${attempt} 次），结果为空，3 秒后重试..."
            sleep 3
          done

          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "无法创建 apply 作业（可能是配置或调用出错），本次视为未抢到，保持静默。"
            echo "apply_result=unavailable" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Apply 作业 ID: $JOB_ID"

          # 2) 轮询作业状态，直到结束或超时（最长约 30 分钟）
          for i in $(seq 1 180); do
            STATUS=$(oci resource-manager job get \
              --job-id "$JOB_ID" \
              --query 'data."lifecycle-state"' \
              --raw-output 2>/dev/null || echo "UNKNOWN")
            echo "轮询 #$i: 作业状态 = $STATUS"
            case "$STATUS" in
              SUCCEEDED) APPLY_RESULT="success"; break ;;
              FAILED | CANCELED) APPLY_RESULT="failed"; break ;;
            esac
            sleep 10
          done

          # 3) 若失败，拉取该工作 Terraform 日志，判断是否是无容量（正常抢不到）还是其它错误（需告警）
          if [ "$APPLY_RESULT" = "failed" ]; then
            TF_LOG=$(oci resource-manager job get-job-logs \
              --job-id "$JOB_ID" 2>/dev/null || true)
            if echo "$TF_LOG" | grep -qi "host capacity" || echo "$TF_LOG" | grep -qi "OutOfHostCapacity"; then
              APPLY_RESULT="failed_capacity"
            else
              APPLY_RESULT="failed_other"
            fi
            if [ "$APPLY_RESULT" = "failed_other" ]; then
              echo "----- 以下为非容量错误的作业日志尾部，便于排查 -----"
              echo "$TF_LOG" | tail -n 40
            fi
          fi

          echo "=== 最终结果: $APPLY_RESULT ==="
          echo "apply_result=$APPLY_RESULT" >> $GITHUB_OUTPUT
          exit 0

      # 通知逻辑：
      #   - success（抢到）        -> 故意使运行失败 -> GitHub 邮件通知你；
      #   - failed_other（配置错） -> 故意使运行失败 -> 邮件告警，避免静默空等；
      #   - failed_capacity / already_exists / unavailable / timeout -> 保持成功 -> 静默。
      - name: 通知处理（抢到实例或异常则故意失败以触发邮件）
        if: always()
        shell: bash
        run: |
          case "${{ steps.apply.outputs.apply_result }}" in
            success)
              echo "======================================================"
              echo "  ✓ 已成功创建 IntNet-Proxy 实例！"
              echo "  故意使本次运行失败，从而触发 GitHub 邮件通知你。"
              echo "  收到邮件后请立即到 Actions 页禁用本工作流（或删除实例），避免重复创建。"
              echo "  注意：即便忘记禁用，工作流也会在下次运行时先检测到实例已存在而自动跳过。"
              echo "======================================================"
              exit 1
              ;;
            failed_other)
              echo "======================================================"
              echo "  ✗ 检测到非容量类错误（可能为配置/凭据/网络问题），"
              echo "  故意使本次运行失败，触发邮件告警，请及时排查日志。"
              echo "======================================================"
              exit 1
              ;;
            failed_capacity)
              echo "实例创建未成功，但原因确认为主机无容量（正常抢不到），保持成功状态，静默等待下一轮重试..."
              exit 0
              ;;
            already_exists)
              echo "目标实例已存在，无需重复创建，保持成功状态，静默结束本次运行..."
              exit 0
              ;;
            *)
              echo "未抢到实例（可能无主机容量），保持成功状态，静默等待下一次重试..."
              exit 0
              ;;
          esac